[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlaswm"
version = "2.0.0"
description = "Structured characteristic-function regularization for end-to-end JEPA world models."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Darvy Cana" }]
keywords = [
  "jepa",
  "world-model",
  "representation-learning",
  "latent-dynamics",
  "characteristic-functions",
  "spherical-designs",
  "cramer-wold",
  "bhep",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
student-t = ["scipy>=1.11"]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "scipy>=1.11",
]

[project.scripts]
atlaswm-train = "atlaswm.cli:train_main"
atlaswm-evaluate = "atlaswm.cli:evaluate_main"

[project.urls]
Homepage = "https://github.com/darvyc/AtlasWM"
Repository = "https://github.com/darvyc/AtlasWM"
Issues = "https://github.com/darvyc/AtlasWM/issues"

[tool.setuptools]
packages = ["atlaswm", "atlaswm.planning"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["atlaswm"]

[tool.coverage.report]
show_missing = true
fail_under = 75
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
