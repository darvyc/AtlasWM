[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlaswm"
version = "1.0.0"
description = "Structured characteristic-function regularization for end-to-end JEPA world models."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Darvy Cana" },
]
keywords = [
  "jepa",
  "world-model",
  "self-supervised-learning",
  "representation-learning",
  "latent-dynamics",
  "characteristic-functions",
  "spherical-designs",
  "cramer-wold",
  "bhep",
  "henze-zirkler",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "torch>=2.0",
  "numpy>=1.24",
  "tqdm>=4.65",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
student-t = ["scipy>=1.10"]
dev = [
  "build>=1.2",
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.3",
  "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/darvyc/AtlasWM"
Documentation = "https://github.com/darvyc/AtlasWM#readme"
Repository = "https://github.com/darvyc/AtlasWM"
Issues = "https://github.com/darvyc/AtlasWM/issues"
Changelog = "https://github.com/darvyc/AtlasWM/blob/main/CHANGELOG.md"
Manuscript = "https://github.com/darvyc/AtlasWM/blob/main/paper/atlaswm.md"

[project.scripts]
atlaswm-train = "atlaswm.cli:main"

[tool.setuptools]
packages = ["atlaswm", "atlaswm.planning"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["atlaswm"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
