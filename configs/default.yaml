seed: 42

data:
  name: toy
  n_trajectories: 96
  traj_length: 48
  sub_length: 8
  img_size: 64
  action_noise: 0.02
  split:
    train: 0.8
    validation: 0.1

model:
  img_size: 64
  patch_size: 8
  embed_dim: 192
  action_dim: 2
  history_length: 8
  encoder_depth: 4
  encoder_heads: 3
  predictor_depth: 4
  predictor_heads: 8
  predictor_dropout: 0.1
  target_mode: ema
  ema_decay: 0.996
  regularizer_scope: marginal

regularizer:
  name: atlas
  design: cross_polytope
  rotation_mode: haar
  rotation_refresh_steps: 16
  resample_during_eval: false
  deduplicate_antipodes: true
  subspace_dim: 1
  n_subspaces: 1
  target: gaussian
  standardize_1d: false
  whiten_kd: false
  estimator: biased
  one_d_backend: quadrature
  kernel: two_scale
  lambda_1: 0.5
  lambda_2: 2.0
  alpha: 0.5
  n_knots: 33
  projection_chunk_size: 192
  frequency_chunk_size: 8
  pair_chunk_size: 256

trainer:
  epochs: 10
  batch_size: 32
  num_workers: 0
  lr: 0.0003
  weight_decay: 0.01
  lambda_reg: 0.1
  grad_clip: 1.0
  warmup_steps: 100
  amp: true
  deterministic: true
  log_every: 50
  validate_every: 1
  checkpoint_every: 1
  device: auto

output:
  dir: outputs/default

evaluation:
  probe_max_batches: 50
  toy_control:
    enabled: true
    episodes: 20
    max_steps: 40
    horizon: 5
    n_samples: 256
    n_iters: 6
    n_elites: 32
    action_low: -2.0
    action_high: 2.0
    smoothness_penalty: 0.001
