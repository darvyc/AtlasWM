# Default AtlasWM research configuration.
#
# This uses raw-projection target matching. It constrains location, scale, and
# distributional shape rather than studentising each projection.

seed: 42

data:
  name: toy
  n_trajectories: 200
  traj_length: 64
  sub_length: 8
  img_size: 64
  batch_size: 32
  num_workers: 0

model:
  img_size: 64
  patch_size: 8
  embed_dim: 192
  action_dim: 2
  history_length: 8
  encoder_depth: 4
  encoder_heads: 3
  predictor_depth: 4
  predictor_heads: 8
  predictor_dropout: 0.1

regularizer:
  design: cross_polytope
  n_haar_projections: 1024
  rotate: true
  deduplicate_antipodes: true
  subspace_dim: 1
  n_subspaces: 1
  target: gaussian
  student_t_nu: 5.0
  student_t_scale: 1.0
  standardize_1d: false
  whiten_kd: false
  estimator: biased
  one_d_backend: quadrature
  kernel: two_scale
  lambda_: 1.0
  lambda_1: 0.5
  lambda_2: 2.0
  alpha: 0.5
  n_knots: 17
  hz_beta: 1.0
  eps: 1.0e-6

trainer:
  epochs: 10
  lr: 3.0e-4
  weight_decay: 0.01
  lambda_reg: 0.1
  grad_clip: 1.0
  log_every: 50
  device: auto

output:
  dir: outputs/default
  save_every: 1
