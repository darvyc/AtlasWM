seed: 42

data:
  name: trajectory_npy
  path: data/pusht/train
  observation_file: observations.npy
  action_file: actions.npy
  state_file: states.npy
  normalize_images: true
  channel_last: false
  sub_length: 4
  img_size: 224
  split:
    train: 0.8
    validation: 0.1

model:
  img_size: 224
  patch_size: 14
  embed_dim: 192
  action_dim: 2
  history_length: 4
  encoder_depth: 12
  encoder_heads: 3
  predictor_depth: 6
  predictor_heads: 16
  predictor_dropout: 0.1
  detach_prediction_target: false

regularizer:
  name: atlas
  design: cross_polytope
  rotation_mode: haar
  rotation_refresh_steps: 16
  resample_during_eval: false
  deduplicate_antipodes: true
  subspace_dim: 1
  n_subspaces: 1
  target: gaussian
  standardize_1d: false
  whiten_kd: false
  estimator: biased
  one_d_backend: quadrature
  kernel: two_scale
  lambda_1: 0.5
  lambda_2: 2.0
  alpha: 0.5
  n_knots: 33
  projection_chunk_size: 192
  frequency_chunk_size: 8
  pair_chunk_size: 256

trainer:
  epochs: 100
  batch_size: 128
  num_workers: 4
  lr: 0.0003
  weight_decay: 0.01
  lambda_reg: 0.1
  grad_clip: 1.0
  warmup_steps: 1000
  amp: true
  deterministic: false
  log_every: 100
  validate_every: 1
  checkpoint_every: 1
  device: auto

output:
  dir: outputs/pusht

evaluation:
  probe_max_batches: 100
  toy_control:
    enabled: false
