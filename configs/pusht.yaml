# PushT-scale AtlasWM configuration for the generic trajectory NPZ interface.
# Place data in data/pusht/trajectories.npz with arrays:
#   obs:     (N, T, C, H, W) uint8 or float32
#   actions: (N, T, 2) float32
# Dataset provenance, preprocessing, splits, and evaluation follow the benchmark
# protocol in docs/benchmark_protocol.md.

seed: 42

data:
  name: trajectory_npz
  path: data/pusht
  obs_key: obs
  action_key: actions
  state_key: null
  normalize_images: true
  channel_last: false
  img_size: 224
  batch_size: 128
  num_workers: 4
  sub_length: 4

model:
  img_size: 224
  patch_size: 14
  embed_dim: 192
  action_dim: 2
  history_length: 3
  encoder_depth: 12
  encoder_heads: 3
  predictor_depth: 6
  predictor_heads: 16
  predictor_dropout: 0.1

regularizer:
  design: cross_polytope
  n_haar_projections: 1024
  rotate: true
  deduplicate_antipodes: true
  subspace_dim: 1
  n_subspaces: 1
  target: gaussian
  student_t_nu: 5.0
  student_t_scale: 1.0
  standardize_1d: false
  whiten_kd: false
  estimator: biased
  one_d_backend: quadrature
  kernel: two_scale
  lambda_: 1.0
  lambda_1: 0.5
  lambda_2: 2.0
  alpha: 0.5
  n_knots: 17
  hz_beta: 1.0
  eps: 1.0e-6

trainer:
  epochs: 10
  lr: 3.0e-4
  weight_decay: 0.01
  lambda_reg: 0.09
  grad_clip: 1.0
  log_every: 100
  device: auto

output:
  dir: outputs/pusht
  save_every: 1
