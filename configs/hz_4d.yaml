# Classical Henze-Zirkler-style normal-shape configuration on random 4D
# subspaces. Whitening removes location and covariance within each subspace.

seed: 42

data:
  name: toy
  n_trajectories: 200
  traj_length: 64
  sub_length: 8
  img_size: 64
  batch_size: 32
  num_workers: 0

model:
  img_size: 64
  patch_size: 8
  embed_dim: 192
  action_dim: 2
  history_length: 8
  encoder_depth: 4
  encoder_heads: 3
  predictor_depth: 4
  predictor_heads: 8
  predictor_dropout: 0.1

regularizer:
  design: cross_polytope       # unused by the k-D path
  rotate: true                 # unused by the k-D path
  subspace_dim: 4
  n_subspaces: 4
  target: gaussian
  whiten_kd: true
  estimator: biased
  hz_beta: null                # classical sample-size-dependent HZ bandwidth

trainer:
  epochs: 10
  lr: 3.0e-4
  weight_decay: 0.01
  lambda_reg: 1.0
  grad_clip: 1.0
  log_every: 50
  device: auto

output:
  dir: outputs/hz_4d
  save_every: 1
