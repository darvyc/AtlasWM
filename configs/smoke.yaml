seed: 7

data:
  name: toy
  n_trajectories: 6
  traj_length: 8
  sub_length: 3
  img_size: 16
  action_noise: 0.0
  split:
    train: 0.6
    validation: 0.2

model:
  img_size: 16
  patch_size: 4
  embed_dim: 16
  action_dim: 2
  history_length: 3
  encoder_depth: 1
  encoder_heads: 2
  predictor_depth: 1
  predictor_heads: 2
  predictor_dropout: 0.0
  detach_prediction_target: false

regularizer:
  name: atlas
  design: cross_polytope
  rotation_mode: signed_permutation
  rotation_refresh_steps: 1
  deduplicate_antipodes: true
  subspace_dim: 1
  target: gaussian
  estimator: biased
  one_d_backend: quadrature
  kernel: single
  lambda_: 1.0
  n_knots: 9
  projection_chunk_size: 16
  frequency_chunk_size: 4
  pair_chunk_size: 32

trainer:
  epochs: 1
  batch_size: 4
  num_workers: 0
  lr: 0.0003
  weight_decay: 0.0
  lambda_reg: 0.1
  grad_clip: 1.0
  warmup_steps: 0
  amp: false
  deterministic: true
  log_every: 0
  validate_every: 1
  checkpoint_every: 1
  device: cpu

output:
  dir: outputs/smoke

evaluation:
  probe_max_batches: 2
  toy_control:
    enabled: false
